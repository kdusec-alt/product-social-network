function render(){const title={feed:'型體動態牆',mine:'我的待辦',knowledge:'產品問題知識庫',models:'型體總覽',meeting:'會議模式',legacy:'原有檢核入口'};$('#pageTitle').textContent=title[view];$('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#newPost').style.display=view==='legacy'?'none':'';$('#feedArea').style.display=view==='legacy'?'none':'';$('#legacyArea').classList.toggle('show',view==='legacy');let list=posts.filter(p=>{let searchable=[p.model,p.color,p.title,p.body,p.owner,p.people,p.stage,p.factory,p.season,p.td,p.author,p.source,p.launch,p.due,...(p.assignments||[]).flatMap(a=>[a.assignee,a.request,a.response,a.status]),...(p.comments||[]).flatMap(c=>[c.name,c.text])].filter(Boolean).join(' ').toLowerCase();let match=searchable.includes(query.toLowerCase());return match&&(filter==='all'||p.status===filter)&&(view!=='risk'||p.status==='block')&&(view!=='mine'||(p.assignments||[]).some(a=>isMine(a.assignee)&&a.status!=='done'))});$('#summary').innerHTML=`<div class="card metric"><b>${new Set(posts.map(p=>p.model+'|'+p.color)).size}</b><span>追蹤型體配色</span></div><div class="card metric r"><b>${posts.filter(p=>p.status==='block').length}</b><span>可能影響上線</span></div><div class="card metric a"><b>${posts.filter(p=>p.status==='verify').length}</b><span>等待驗證</span></div><div class="card metric"><b>${posts.filter(p=>p.status!=='closed').length}</b><span>未關閉問題</span></div>`;$('#mineCount').textContent=posts.reduce((n,p)=>n+(p.assignments||[]).filter(a=>isMine(a.assignee)&&a.status!=='done').length,0);$('#tabs').innerHTML=['all','block','progress','verify','closed'].map(k=>`<button data-filter="${k}" class="${filter===k?'active':''}">${k==='all'?'全部問題':label[k]}</button>`).join('');$('#posts').innerHTML=list.length?list.map(postHtml).join(''):'<div class="card empty">沒有符合條件的問題。試試型體代碼、配色或問題關鍵字。</div>';$('#priority').innerHTML=posts.filter(p=>p.status==='block').slice(0,3).map(p=>`<div class="riskRow"><i class="dot"></i><div><b>${esc(p.model)} · ${esc(p.title)}</b><span>${esc(p.owner)} · ${esc(p.stage)}</span></div></div>`).join('')||'<p class="help">目前沒有標記為上線風險的問題。</p>';$('#modelLinks').innerHTML=[...new Map(posts.map(p=>[p.model+'|'+p.color,p])).values()].slice(0,5).map(p=>`<a class="modelLink" href="#" data-model="${esc(p.model)}">${esc(p.model)} · ${esc(p.color)}<span>${esc(p.factory)} · ${esc(p.season)}</span></a>`).join('');$('#legacyArea').innerHTML=`<h2>${tx('legacyTableTitle')}</h2><table><thead><tr><th>${tx('department')}</th><th>${tx('scope')}</th><th>${tx('legacyCount')}</th><th>${tx('newRelation')}</th></tr></thead><tbody>${checklist.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>型體檢核清單＋動態問題卡</td></tr>`).join('')}</tbody></table>`;}
function tagText(value){return esc(value).replace(/([#@][\p{L}\p{N}][\p{L}\p{N}_.\/-]*)/gu,'<span class="tagToken">$1</span>')}function sourceBadge(p){let src=String(p.source||'').toLowerCase(),kind=/(outlook|mail|郵件)/i.test(src)?'mail':/(mrc|型體就緒|檢核表)/i.test(src)?'mrc':'issue',label=kind==='mail'?'✉ Mail':kind==='mrc'?'MRC':tx('issue');return `<span class="sourceBadge source-${kind}" title="${esc(p.source||'工作台貼文')}">${label}</span>`}function postTags(p){let refs=Array.isArray(p.tagRefs)?p.tagRefs:[];if(!refs.length){let items=[["#",p.model],["#",p.color],["@",p.owner],...String(p.people||'').split(/[・、,，/／|]+/).map(x=>['@',x.trim()]),["#",String(p.stage||'').replace(/\s*(?:→|->|・|、|\/)\s*/g,'_')]];refs=items.filter(x=>x[1]&&x[1]!=='待指定'&&x[1]!=='待確認').map(([marker,name])=>({marker,name}))}return refs.map(t=>`<span class="tagToken" data-category="${esc(t.category||'topic')}" data-marker="${esc(t.marker||'#')}">${esc((t.marker||'#')+t.name)}</span>`).join('')}function postHtml(p){return `<article class="card post"><div class="postHead"><span class="avatar">${esc(p.author.slice(0,1))}</span><div class="grow"><div class="person">${esc(p.author)}</div><div class="time">${esc(p.time)} · ${esc(p.source)}</div></div><div class="postHeadRight">${sourceBadge(p)}<span class="badge ${cls[p.status]}">${tx(p.status)}</span></div></div><div class="postBody"><div class="model">${esc(p.factory)} · ${esc(p.season)}　/　${esc(p.model)}　/　${esc(p.color)}　/　${esc(p.td)}</div><div class="postTags">${postTags(p)}</div><h2>${esc(p.title)}</h2><p>${tagText(p.body)}</p><div class="tags"><span>${tx('owner')} ${tagText(p.owner)}</span><span>${tx('collaborators')} ${tagText(p.people)}</span><span>${tx('stage')} ${tagText(p.stage)}</span></div><div class="postPhoto"><span class="photoicon">▧</span><span>${esc(p.photo)}</span></div><div class="postMeta"><span>◷ ${tx('launch')}: ${esc(p.launch)}</span><span>◎ ${tx('due')}: ${esc(p.due)}</span></div></div><div class="actions"><button data-action="reply" data-id="${esc(p.id)}">↩ ${tx('reply')} (${p.comments.length})</button><button data-action="status" data-id="${esc(p.id)}">◉ ${tx('updateStatus')}</button><button data-action="detail" data-id="${esc(p.id)}">▤ ${tx('issueContext')}</button></div><div class="comments">${p.comments.slice(-3).map(c=>`<div class="comment"><span class="avatar" style="width:26px;height:26px;font-size:11px">${esc(c.name[0])}</span><div class="bubble"><b>${esc(c.name)}</b><small>${esc(c.time)}</small><div>${tagText(c.text)}</div></div></div>`).join('')}<div class="reply"><input aria-label="${tx('replyTo')} ${esc(p.title)}" id="reply-${esc(p.id)}" placeholder="${tx('replyPlaceholder')}"><button data-action="send" data-id="${esc(p.id)}">${tx('reply')}</button></div></div></article>`}
function modal(title,html,mode){modalMode=mode;$('#modalTitle').textContent=title;$('#modalContent').innerHTML=html;$('#modalBack').classList.add('show')};function close(){modalMode='';$('#modalBack').classList.remove('show')};function form(){modal(tx('newIssue'),`<div class="grid2"><div class="field"><label>型體底模 *</label><input id="fModel" placeholder="例：JDB-1666"></div><div class="field"><label>面版配色 *</label><input id="fColor" placeholder="例：HV6474-400"></div></div><div class="field"><label>問題標題 *</label><input id="fTitle" placeholder="說清楚異常與影響"></div><div class="field"><label>問題與目前狀況</label><textarea id="fBody" placeholder="現象、已做處置、待確認事項"></textarea></div><div class="field"><label>指定回饋</label><div id="assignmentFields" class="assignmentFields"></div></div><div class="grid2"><div class="field"><label>主責大 A</label><select id="fOwner">${checklist.map(x=>`<option>${x[0]}</option>`).join('')}</select></div><div class="field"><label>影響製程</label><input id="fStage" placeholder="例：底加 → 成型"></div></div><div class="grid2"><div class="field"><label>協作單位</label><input id="fPeople" placeholder="例：QM・資材"></div><div class="field"><label>下一步期限</label><input id="fDue" type="date"></div></div>`, 'new')};
document.addEventListener('click',e=>{let n=e.target.closest('[data-view]');if(n){view=n.dataset.view;filter='all';render();return}let f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render();return}let m=e.target.closest('[data-model]');if(m){e.preventDefault();query=m.dataset.model;$('#search').value=query;view='feed';render();return}let a=e.target.closest('[data-action]');if(!a)return;let p=posts.find(x=>x.id===a.dataset.id);if(a.dataset.action==='send'){let input=$('#reply-'+p.id),v=input.value.trim();if(!v)return toast('請先輸入更新內容');p.comments.push({name:'Demo User · 示範使用者',text:v,time:new Date().toLocaleString('zh-TW',{timeZone:'Asia/Bangkok',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})});save();render();toast('進展已更新於這則問題');}else if(a.dataset.action==='status'){modal(tx('statusTitle'),`<p><b>${esc(p.model)} · ${esc(p.title)}</b></p><div class="field"><label>狀態</label><select id="newStatus">${Object.keys(label).map(k=>`<option value="${k}" ${p.status===k?'selected':''}>${label[k]}</option>`).join('')}</select></div><div class="field"><label>變更說明／驗證依據</label><textarea id="statusNote" placeholder="關閉問題前請寫明驗證結果"></textarea></div>`, 'status:'+p.id)}else if(a.dataset.action==='detail'){modal(tx('issueDetail'),`<div class="notice">${esc(p.id)} · ${esc(p.model)} / ${esc(p.color)} · ${esc(p.status==='closed'?'已關閉':'仍在追蹤')}</div><h3>${esc(p.title)}</h3><p>${esc(p.body)}</p><p>主責：${esc(p.owner)}　協作：${esc(p.people)}<br>製程：${esc(p.stage)}<br>來源：${esc(p.source)}</p><h3>進展歷程</h3>${p.comments.map(c=>`<p><b>${esc(c.name)} (${esc(c.time)})</b><br>${esc(c.text)}</p>`).join('')||'<p>尚無回覆</p>'}`,'detail')}});$('#search').addEventListener('input',e=>{query=e.target.value.trim();render()});$('#newPost').onclick=$('#composeButton').onclick=form;$('#closeModal').onclick=close;$('#modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack')close()});$('#submitModal').onclick=()=>{if(modalMode==='new'){let model=$('#fModel').value.trim(),color=$('#fColor').value.trim(),title=$('#fTitle').value.trim();if(!model||!color||!title)return toast('請填型體、配色與問題標題');posts.unshift({id:'MRC-'+Date.now(),model,color,title,body:$('#fBody').value.trim(),td:'待確認',factory:'待確認',season:'待確認',owner:$('#fOwner').value,people:$('#fPeople').value||'待指定',author:(activeUser?.name||activePersona)+' · '+(activeUser?.unit||activeUnit),time:new Date().toLocaleString('zh-TW',{timeZone:'Asia/Bangkok'}),stage:$('#fStage').value||'待確認',launch:'待維護',due:$('#fDue').value||'待確認',status:'progress',photo:'尚未附照片',source:'手動發布',comments:[]});save();close();render();toast('問題已發布至動態牆')}else if(modalMode.startsWith('status:')){let p=posts.find(x=>x.id===modalMode.slice(7)),s=$('#newStatus').value,n=$('#statusNote').value.trim();if(s==='closed'&&!n)return toast('關閉時請填驗證依據');p.status=s;if(n)p.comments.push({name:'Demo User · 狀態更新',text:n,time:new Date().toLocaleString('zh-TW',{timeZone:'Asia/Bangkok'})});save();close();render();toast('狀態已更新')}else close()};$('#exportMeeting').onclick=exportCsv;$('#openLegacy').onclick=()=>{view='legacy';render()};$('#mailReview').onclick=()=>modal('郵件匯入預覽',`<p><b>JDB-1666 · HV6474-400</b><br>PU 灌注後麻點：需核對允收範圍。照片待人工核對。</p><p><b>BB-1699 · IO7926-002</b><br>鞋頭 Skin 膠外溢：建議內縮方案待驗證。</p>`,'detail');function exportCsv(){let rows=[['型體底模','面版配色','廠別','問題ID','問題','主責','協作','影響製程','上線節點','狀態','下一步期限','最新進展','來源'],...posts.filter(p=>p.status!=='closed').map(p=>[p.model,p.color,p.factory,p.id,p.title,p.owner,p.people,p.stage,p.launch,label[p.status],p.due,p.comments.at(-1)?.text||'',p.source])];let csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='MRC_會議問題清單.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('會議清單已下載')};$('#lang').onchange=e=>{let l=e.target.value;document.documentElement.lang=l==='zh'?'zh-Hant':l;$('#search').placeholder=({zh:'搜尋型體、配色、問題、同仁…',vi:'Tìm mã giày, màu, vấn đề, đồng nghiệp…',en:'Search model, color, issue, colleague…'})[l];toast(l==='zh'?'目前為中文版':'語言切換示意；正式版將完整翻譯介面與問題內容')};render();
</script>
<style>.composerBox{border:1px solid #d8e2ea;border-radius:12px;overflow:hidden}.composerBox textarea{width:100%;min-height:155px;border:0;resize:vertical;padding:16px;outline:0;font-size:16px}.composerTools{border-top:1px solid var(--line);padding:11px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}.composerTools button{border:1px solid var(--line);border-radius:8px;background:#fff;padding:7px 10px;color:#42627d}.suggest{display:none;border:1px solid #cddbeb;border-radius:10px;background:#fff;box-shadow:0 12px 30px #1f405526;max-height:200px;overflow:auto;margin-top:5px}.suggest.show{display:block}.suggest button{display:block;width:100%;text-align:left;padding:9px 12px;border:0;background:white}.suggest button:hover{background:#eaf3ff}.composerPreview{background:#f2f7fc;border-radius:9px;padding:10px 12px;margin:10px 0;font-size:12px;color:#526b80}.importItem{border:1px solid var(--line);border-radius:9px;padding:12px;margin:10px 0}.importItem b{display:block}.importItem small{color:var(--muted)}.importItem label{display:flex;gap:8px;align-items:start}.importItem input{margin-top:4px}.sourceTag{color:#1b64ae;font-weight:700}.fileHint{font-size:12px;color:var(--muted)}</style>
<script>
const entities=[...checklist.map(x=>({kind:'單位',name:x[0],owner:x[0]}))];
let selectedTags=[];let newMail=[];
function socialComposer(){selectedTags=[];modal('發布型體動態',`<div class="composerBox"><textarea id="socialText" placeholder="發生了什麼問題？"></textarea><div class="composerTools"><button type="button" id="atTrigger">＠ 標註</button><button type="button" id="hashTrigger"># 標籤</button><button type="button" id="photoTrigger">▧ 照片</button><span class="fileHint" id="photoNames"></span><input id="socialPhotos" type="file" accept="image/*" multiple hidden></div></div><div class="suggest" id="tagSuggest"></div><div class="composerPreview" id="tagPreview"></div><div class="field"><label>指定回饋</label><div id="assignmentFields" class="assignmentFields"></div></div><div class="grid2"><div class="field"><label>主責大 A</label><select id="socialOwner"><option value="">由標註與規則建議</option>${checklist.map(x=>`<option>${x[0]}</option>`).join('')}</select></div><div class="field"><label>狀態</label><select id="socialStatus"><option value="progress">處理中</option><option value="block">影響上線</option><option value="verify">待驗證</option></select></div></div>`,'social');$('#socialText').oninput=showTags;$('#atTrigger').onclick=()=>{let a=$('#socialText');a.value+=' @';a.focus();showTags()};$('#photoTrigger').onclick=()=>$('#socialPhotos').click();$('#socialPhotos').onchange=()=>$('#photoNames').textContent=[...$('#socialPhotos').files].map(f=>f.name).join('、')+'（本機預覽）'}
function showTags(){let el=$('#socialText'),before=el.value.slice(0,el.selectionStart),m=before.match(/@([^@\s，,。]*)$/),box=$('#tagSuggest');if(!m){box.classList.remove('show');return}let q=m[1].toLowerCase();let matches=entities.filter(x=>x.name.toLowerCase().includes(q)).slice(0,9);box.innerHTML=matches.map((x,i)=>`<button type="button" data-tag-index="${i}"><b>@${esc(x.name)}</b>　<small>${x.kind}</small></button>`).join('');box.classList.toggle('show',!!matches.length);box.onclick=e=>{let b=e.target.closest('[data-tag-index]');if(!b)return;let item=matches[Number(b.dataset.tagIndex)],start=el.selectionStart-before.match(/@([^@\s，,。]*)$/)[0].length;el.value=el.value.slice(0,start)+'@'+item.name+' '+el.value.slice(el.selectionStart);el.focus();el.setSelectionRange(start+item.name.length+2,start+item.name.length+2);selectedTags.push(item);box.classList.remove('show');$('#tagPreview').textContent='已標註：'+selectedTags.map(x=>`@${x.name}（${x.kind}）`).join(' · ');if(item.owner&&!$('#socialOwner').value)$('#socialOwner').value=item.owner}}
$('#newPost').onclick=$('#composeButton').onclick=socialComposer;
const priorSubmit=$('#submitModal').onclick;$('#submitModal').onclick=()=>{if(modalMode!=='social'&&modalMode!=='mail-import'){priorSubmit();return}if(modalMode==='mail-import'){let ids=[...document.querySelectorAll('.mailPick:checked')].map(x=>x.value),added=0;ids.forEach(id=>{if(posts.some(p=>p.id===id))return;let p=newMail.find(x=>x.id===id);posts.unshift({...p,td:'待確認',factory:'C／D 廠待核對',season:'待確認',launch:'待對接主時程',comments:[]});added++});save();close();render();toast(`新增 ${added} 則問題；重複項目已略過`);return}let text=$('#socialText').value.trim();if(!text)return toast('請先輸入問題');let model=selectedTags.find(x=>x.model)?.model||text.match(/(?:SOB|JDB|BBB|BB|PN|SWB|KDB)[T-]*\d{3,4}(?:MS|GS|-\d)?/i)?.[0]||'';let color=selectedTags.find(x=>x.color)?.color||text.match(/[A-Z]{2}\d{4}-\d{3}/i)?.[0]||'';if(!model||!color)return toast('請先 @ 標註型體與配色，避免歸錯資料');let owner=$('#socialOwner').value||selectedTags.find(x=>x.owner)?.owner||'待指派';let people=[...new Set(selectedTags.filter(x=>x.owner||x.kind==='同仁').map(x=>x.name))].filter(x=>x!==owner).join('・')||'待指定';posts.unshift({id:'MRC-'+Date.now(),model,color,td:'待確認',factory:'待確認',season:'待確認',title:text.split('\n')[0].replace(/[@#][^\s]+/g,'').trim().slice(0,55)||'型體新問題',body:text,owner,people,author:(activeUser?.name||activePersona)+' · '+(activeUser?.unit||activeUnit),time:new Date().toLocaleString('zh-TW',{timeZone:'Asia/Bangkok'}),stage:'待確認',launch:'待維護',due:'待確認',status:$('#socialStatus').value,photo:[...$('#socialPhotos').files].map(f=>f.name).join('、')||'尚未附照片',source:'工作台貼文',comments:[]});save();close();render();toast('已發布並建立標註關聯')};
$('#mailReview').onclick=()=>{let html=''+newMail.map(p=>`<div class="importItem"><label><input class="mailPick" type="checkbox" value="${p.id}" ${posts.some(x=>x.id===p.id)?'disabled':''}><span><b>${esc(p.model)} / ${esc(p.color)} · ${esc(p.title)}</b><small>${esc(p.source)} · 建議主責 ${esc(p.owner)}${posts.some(x=>x.id===p.id)?' · 已匯入':''}</small><br>${esc(p.body)}</span></label></div>`).join('')+'<p class="fileHint">原信提到的 JA3266-100、HQ3158-003、IW2791-100 是同一材料問題的配色範圍；正式版應建立一張共通問題卡並關聯多配色。本示範先以 IW2791-100 作主卡。</p>';modal('郵件問題匯入審核',html,'mail-import');$('#submitModal').textContent='匯入已勾選';};

const priorModal=modal;modal=(title,html,mode)=>{priorModal(title,html,mode);document.querySelector('#submitModal').textContent=mode==='readiness-new'?tx('save'):(uiLang==='en'?'Confirm':uiLang==='vi'?'Xác nhận':'確認')};const priorRender=render;render=()=>{priorRender();let ready=view==='readiness';document.querySelector('#feedArea').style.display=ready?'none':(view==='legacy'?'none':'');document.querySelector('#legacyArea').classList.toggle('show',view==='legacy');document.querySelector('#readinessArea').classList.toggle('show',ready);if(ready){document.querySelector('#pageTitle').textContent=tx('ready');document.querySelector('#pageSub').textContent=tx('readySub');document.querySelector('#newPost').style.display='none';renderReadiness()}applyLanguage()};

function applyLoginLanguage(){let h=document.querySelector('.loginCard h1'),p=document.querySelector('.loginCard>p'),labels=document.querySelectorAll('#loginForm label');h.textContent=uiLang==='en'?'Sign in to MRC':uiLang==='vi'?'Đăng nhập MRC':'登入量產就緒工作台';p.textContent=uiLang==='en'?'Your account determines your tasks, mentions and notifications.':uiLang==='vi'?'Tài khoản xác định công việc, lượt nhắc và thông báo của bạn.':'使用個人帳號登入後，系統會依本人與所屬單位顯示待辦、標註及通知。';if(labels[0])labels[0].childNodes[0].textContent=uiLang==='en'?'Account':uiLang==='vi'?'Tài khoản':'帳號';if(labels[1])labels[1].childNodes[0].textContent=uiLang==='en'?'Password':uiLang==='vi'?'Mật khẩu':'密碼';document.querySelector('#loginForm .primary').textContent=uiLang==='en'?'Sign in':uiLang==='vi'?'Đăng nhập':'登入';document.querySelector('#ssoButton').textContent=uiLang==='en'?'Sign in with Microsoft 365':uiLang==='vi'?'Đăng nhập bằng Microsoft 365':'使用企業 Microsoft 365 帳號登入'}document.querySelector('#openReadiness').onclick=()=>{view='readiness';render()};document.querySelector('#lang').value=uiLang;document.querySelector('#loginLang').value=uiLang;document.querySelector('#lang').onchange=document.querySelector('#loginLang').onchange=e=>{uiLang=e.target.value;localStorage.setItem('mrcLang',uiLang);document.querySelector('#lang').value=uiLang;document.querySelector('#loginLang').value=uiLang;applyLoginLanguage();render()};applyLoginLanguage();

<script>
const readyStatusText={zh:{pending:'待回覆',progress:'處理中',done:'已完成',issue:'異常',na:'不適用'},en:{pending:'Pending',progress:'In progress',done:'Completed',issue:'Issue',na:'N/A'},vi:{pending:'Chờ phản hồi',progress:'Đang xử lý',done:'Hoàn thành',issue:'Bất thường',na:'Không áp dụng'}};
function templateItemText(item){return uiLang==='vi'?(item.vi||item.source):uiLang==='en'?(item.en||item.zh):item.zh}
function templateItemSeed(unit,due){return (readinessTemplates[unit]||[]).map(x=>({...x,unit,status:'pending',response:'',due:due||'',updated:'',updatedBy:''}))}
openReadyForm=()=>{let unitRows=checklist.map(x=>{let items=readinessTemplates[x[0]]||[];return `<div class="readyDept"><input type="checkbox" data-runit="${esc(x[0])}"><b>${esc(x[0])}</b><span class="templateCount">${items.length} ${uiLang==='en'?'items':uiLang==='vi'?'mục':'項'}</span><input type="text" data-rrequest="${esc(x[0])}" value="${esc(x[1])}" aria-label="${esc(x[0])} request"><input type="date" data-rdue="${esc(x[0])}" aria-label="${esc(x[0])} due"><details><summary>${uiLang==='en'?'Preview checklist':uiLang==='vi'?'Xem mục kiểm tra':'預覽正式檢核項目'}</summary><div class="templatePreview">${items.map((it,i)=>`<div>${i+1}. ${esc(templateItemText(it))} <small>· ${esc(it.targetRule)}</small></div>`).join('')}</div></details></div>`}).join('');modal(tx('newTitle'),`<div class="grid2"><div class="field"><label>${uiLang==='vi'?'Mã khuôn đế':uiLang==='en'?'Model / Bottom Mold':'型體底模'} *</label><input id="rModel" placeholder="JDB-1666"></div><div class="field"><label>${uiLang==='vi'?'Phối màu':uiLang==='en'?'Colorway':'面版配色'} *</label><input id="rColor" placeholder="HV6474-400"></div><div class="field"><label>${uiLang==='vi'?'Nhà máy':uiLang==='en'?'Factory':'首量產廠別'}</label><input id="rFactory" placeholder="B廠"></div><div class="field"><label>${uiLang==='vi'?'Mùa':uiLang==='en'?'Season':'開發季節'}</label><input id="rSeason" placeholder="SU27"></div><div class="field"><label>TD CODE</label><input id="rTd" placeholder="F3"></div><div class="field"><label>PM</label><input id="rPm" value="${esc(activePersona)}"></div><div class="field"><label>${uiLang==='vi'?'Ngày dự kiến lên chuyền':uiLang==='en'?'Planned Launch Date':'預計上線日'}</label><input id="rLaunch" type="date"></div><div class="field"><label>${uiLang==='vi'?'Ghi chú':uiLang==='en'?'Notes':'補充說明'}</label><input id="rNote"></div></div><div class="field"><label>${uiLang==='vi'?'Chọn bộ phận, nội dung phản hồi và thời hạn':uiLang==='en'?'Tag teams, response request and due date':'Tag 單位、指定回覆資訊與期限'}</label><div class="readyDeptGrid">${unitRows}</div></div>`,'readiness-new')};
function projectItems(project){if(project.items?.length)return project.items;let tasks=readyAssignments(project);return tasks.flatMap(a=>templateItemSeed(a.assignee,a.due))}
renderReadiness=()=>{let area=document.querySelector('#readinessArea');area.innerHTML=`<div class="card readyHero"><div><h2>${tx('ready')}</h2><p>${tx('readySub')}</p></div><button class="primary" id="createReadiness">${tx('create')}</button></div><div>${readinessProjects.length?readinessProjects.map(r=>{let items=projectItems(r),done=items.filter(a=>a.status==='done'||a.status==='na').length,pct=items.length?Math.round(done/items.length*100):0,issues=items.filter(a=>a.status==='issue').length;return `<article class="card readyProject"><div class="readyProjectHead"><div><h3>${esc(r.model)} · ${esc(r.color)}</h3><div class="readyProjectMeta">${esc(r.factory)} · ${esc(r.season)} · ${esc(r.td)} · PM ${esc(r.pm)}</div></div><div><b>${pct}%</b>${issues?`<span class="badge red">${issues} ${uiLang==='en'?'issues':uiLang==='vi'?'bất thường':'項異常'}</span>`:''}</div></div><div class="readyProgress"><i style="width:${pct}%"></i></div><div class="readyUnits">${[...new Set(items.map(a=>a.unit))].map(unit=>{let group=items.filter(a=>a.unit===unit),d=group.filter(a=>a.status==='done'||a.status==='na').length;return `<span class="${d===group.length?'done':''}">@${esc(unit)} · ${d}/${group.length}</span>`}).join('')}</div><div class="createdStamp">${tx('owner')}：${esc(r.creator)}　${tx('created')}：${esc(r.createdAt)}</div><button class="quick" data-ready-detail="${esc(r.id)}">${uiLang==='en'?'Open checklist':uiLang==='vi'?'Mở danh sách kiểm tra':'開啟正式檢核表'} →</button></article>`}).join(''):`<div class="card empty">${tx('empty')}</div>`}</div>`;document.querySelector('#createReadiness').onclick=openReadyForm;document.querySelectorAll('[data-ready-detail]').forEach(b=>b.onclick=()=>openReadyDetail(b.dataset.readyDetail))};

<script>

nel(p,active)});let add=document.querySelector('#readyAddUnitBtn');if(add)add.onclick=()=>{let unit=document.querySelector('#readyAddUnit').value,due=p.launch==='待確認'?'':p.launch;p.items.push(...templateItemSeed(unit,due));p.assignments=p.assignments||[];p.assignments.push({assignee:unit,request:(checklist.find(x=>x[0]===unit)||[unit,'完成正式檢核'])[1],due,status:'open',response:'',updated:''});p._dirty=(p._dirty||0)+1;readyPersist();openReadyDetail(id,unit);toast('@'+unit+' '+(uiLang==='en'?'added':uiLang==='vi'?'đã thêm':'已加入正式檢核'))}}

<script>
const replyPhotoDrafts=new Map();
function fileAsDataUrl(file){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})}
function enhanceSocialReplies(){
  if(view!=='feed')return;
  document.querySelectorAll('#posts .post').forEach(card=>{
    let title=card.querySelector('h2')?.textContent,post=posts.find(x=>x.title===title);
    if(!post)return;
    let photo=card.querySelector('.postPhoto');
    if(photo?.querySelector('img'))photo.classList.add('hasPhoto');else photo?.remove();
    card.querySelectorAll('.comment').forEach((row,index)=>{
      let visible=post.comments.slice(-3),comment=visible[index];
      if(comment?.photo&&!row.querySelector('.commentPhoto'))row.querySelector('.bubble')?.insertAdjacentHTML('beforeend',`<img class="commentPhoto" src="${comment.photo}" alt="回覆照片">`)
    });
    let reply=card.querySelector('.reply');
    if(!reply||reply.dataset.photoReady)return;
    reply.dataset.photoReady='1';
    let send=reply.querySelector('[data-action="send"]');
    if(send)send.dataset.action='replySend';
    let fileId='reply-photo-'+post.id.replace(/[^a-zA-Z0-9_-]/g,'');
    reply.querySelector('input')?.insertAdjacentHTML('afterend',`<label class="replyPhotoButton" for="${fileId}" title="新增照片" aria-label="新增照片">▧</label><input id="${fileId}" type="file" accept="image/*" hidden>`);
    let file=reply.querySelector('#'+CSS.escape(fileId));
    file.onchange=async()=>{if(!file.files?.[0])return;try{let data=await vpWatermarkPhoto(file.files[0],activeUser?.name||activePersona);replyPhotoDrafts.set(post.id,data);drawReplyPreview(card,post.id)}catch(error){toast('照片浮水印處理失敗，請重新選擇照片')}};
    if(replyPhotoDrafts.has(post.id))drawReplyPreview(card,post.id);
  })
}
function drawReplyPreview(card,id){
  card.querySelector('.replyPreview')?.remove();let data=replyPhotoDrafts.get(id);if(!data)return;
  let reply=card.querySelector('.reply');reply.insertAdjacentHTML('afterend',`<div class="replyPreview"><img src="${data}" alt="準備上傳的照片"><button type="button" aria-label="移除照片">×</button></div>`);
  card.querySelector('.replyPreview button').onclick=()=>{replyPhotoDrafts.delete(id);drawReplyPreview(card,id)}
}
document.addEventListener('click',e=>{
  let button=e.target.closest('[data-action="replySend"]');if(!button)return;
  e.preventDefault();e.stopImmediatePropagation();
  let post=posts.find(x=>x.id===button.dataset.id),input=document.querySelector('#reply-'+CSS.escape(post.id)),text=input?.value.trim()||'',photo=replyPhotoDrafts.get(post.id)||'';
  if(!text&&!photo)return toast('請輸入回覆內容或新增照片');
  post.comments.push({name:(activeUser?.name||activePersona)+' · '+(activeUser?.unit||activeUnit),text:text||'新增照片',photo,photoBy:activeUser?.name||activePersona,time:new Date().toLocaleString('zh-TW',{timeZone:'Asia/Bangkok',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})});
  replyPhotoDrafts.delete(post.id);save();render();toast('回覆與照片已更新')
},true);
const socialFeedRender=render;
render=()=>{socialFeedRender();enhanceSocialReplies()};

</script>

<script>
function simplifySocialCards(){
  if(view!=='feed')return;
  document.querySelectorAll('#posts .post').forEach(card=>{
    card.querySelector('.socialRefs')?.remove();
    const tagRow=card.querySelector('.postTags');
    const body=card.querySelector('.postBody>p');
    if(tagRow&&body){
      const key=s=>String(s||'').replace(/^[#@]/,'').replace(/[\s_]+/g,'').toLowerCase();
      const seen=new Set();
      tagRow.querySelectorAll('.tagToken').forEach(token=>{const normalized=key(token.textContent);if(normalized&&seen.has(normalized))token.remove();else if(normalized)seen.add(normalized)});
      body.querySelectorAll('.tagToken').forEach(token=>{
        const value=token.textContent.trim(),normalized=key(value);
        if(value&&!seen.has(normalized)){
          const span=document.createElement('span');span.className='tagToken';span.textContent=value;
          tagRow.append(' ',span);seen.add(normalized);
        }
        token.remove();
      });
      body.innerHTML=body.innerHTML.replace(/(?:\s|&nbsp;){2,}/g,' ');
      let normalize=s=>String(s||'').replace(/[\s，。！？!?、,.]/g,'').toLowerCase();
      body.classList.toggle('isDuplicate',normalize(body.textContent)===normalize(card.querySelector('h2')?.textContent));
    }
  })
}
const minimalFeedRender=render;
render=()=>{minimalFeedRender();simplifySocialCards()};
simplifySocialCards();
</script>

<script>
async function vpWatermarkPhoto(file, displayName) {
  if (!file || !file.type.startsWith('image/')) throw new Error('Unsupported image');
  if (file.size > 8 * 1024 * 1024) throw new Error('Image too large');
  const source = await fileAsDataUrl(file);
  const image = new Image();
  image.src = source;
  await image.decode();
  const scale = Math.min(1, 1440 / Math.max(image.naturalWidth, image.naturalHeight));
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
  canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
  const context = canvas.getContext('2d');
  context.fillStyle = '#fff';
  context.fillRect(0, 0, canvas.width, canvas.height);
  context.drawImage(image, 0, 0, canvas.width, canvas.height);
  const name = String(displayName || 'VP User').trim().slice(0, 48);
  const fontSize = Math.max(18, Math.round(canvas.width * .022));
  context.font = `600 ${fontSize}px Arial, sans-serif`;
  context.textAlign = 'center';
  context.textBaseline = 'middle';
  context.lineWidth = Math.max(1, fontSize * .08);
  context.strokeStyle = 'rgba(10, 32, 58, .22)';
  context.fillStyle = 'rgba(255, 255, 255, .36)';
  context.save();
  context.translate(canvas.width / 2, canvas.height / 2);
  context.rotate(-Math.PI / 7);
  const stepX = Math.max(220, fontSize * Math.max(8, name.length * .72));
  const stepY = Math.max(130, fontSize * 5.2);
  for (let y = -canvas.height; y <= canvas.height; y += stepY) {
    for (let x = -canvas.width; x <= canvas.width; x += stepX) {
      context.strokeText(name, x, y);
      context.fillText(name, x, y);
    }
  }
  context.restore();
  return canvas.toDataURL('image/jpeg', .80);
}
function renderVpAccountWatermark() {
  const layer = document.querySelector('#vpAccountWatermark');
  if (!layer) return;
  const name = activeUser && window.verifiedWatermarkAccount || '';
  layer.hidden = !name;
  layer.replaceChildren();
  if (!name) return;
  for (let i = 0; i < 150; i++) {
    const mark = document.createElement('span');
    mark.textContent = name;
    layer.append(mark);
  }
}
const vpPhotoRenderBase = postHtml;
postHtml = post => {
  if (post.photos?.length && !photoPreviews.has(post.id)) photoPreviews.set(post.id, post.photos[0]);
  let html = vpPhotoRenderBase(post);
  const photos = post.photos?.length ? post.photos : (photoPreviews.has(post.id) ? [photoPreviews.get(post.id)] : []);
  if (photos.length > 1) {
    const start = html.indexOf('<div class="postPhoto"');
    const end = start < 0 ? -1 : html.indexOf('</div>', start) + 6;
    if (start >= 0 && end >= 6) {
      const gallery = '<div class="postPhoto vpPhotoGallery hasPhoto">' + photos.map((src, i) => '<img src="' + esc(src) + '" alt="' + (i + 1) + ' 貼文照片">').join('') + '</div>'; 
      html = html.slice(0, start) + gallery + html.slice(end);
    }
  }
  return html;
};
const vpRenderBase = render;
render = () => { renderVpAccountWatermark(); return vpRenderBase(); };
renderVpAccountWatermark();
</script>
