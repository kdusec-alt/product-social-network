<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>VP Product Social Network</title><link rel="icon" href="/logo.png"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/app.css?v=43"></head><body>
<div id="gate" class="gate" hidden><section class="loginCard"><div class="loginBrand"><img src="/logo.png" alt="PaleoNet"><h1>VP Product Social Network</h1></div><select id="gateLanguage" aria-label="登入語言"><option value="zh">中文</option><option value="en">English</option><option value="vi">Tiếng Việt</option></select><h2 id="gateHeading">登入 VP Product Social Network</h2><p id="gateMessage"></p><form id="demoLogin" class="loginForm"><label><span id="accountLabel">帳號</span><input name="account" autocomplete="username" required placeholder="輸入員工帳號"></label><label><span id="passwordLabel">密碼</span><input name="password" type="password" autocomplete="current-password" required placeholder="輸入密碼"></label><button class="primary" id="loginButton">登入</button></form></section></div>
<div id="app" hidden><header class="top"><div class="brand"><img src="/logo.png" alt=""><span><b>VP</b><small>Product Social Network</small></span></div><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜尋型體、配色、問題或同仁"></label><div class="topActions"><button id="headerImport" type="button">匯入 Outlook 郵件</button><button id="noticeButton" aria-label="通知">♧<em id="noticeCount" hidden></em></button><select id="language" aria-label="語言"><option value="zh">中文</option><option value="en">English</option><option value="vi">Tiếng Việt</option></select><button id="profile" aria-label="個人帳號"></button></div></header>
<div class="layout"><aside class="side"><div class="person" id="person"></div><nav id="nav"></nav><div class="sideFoot"><button id="mrcChecklistLink" data-view="checklists">原有檢核入口 ↗</button><div class="sideCard" id="leftModelPanel"></div></div></aside><main class="main"><div id="page"></div></main><aside class="right"><div class="rightCard" id="modelPanel"></div><div class="rightCard" id="focusPanel"></div><div class="rightCard" id="mailPanel"></div></aside></div><div class="mobileNav" id="mobileNav"></div></div><div id="accountWatermark" aria-hidden="true" hidden></div><div id="chatWidget" hidden><section id="chatPanel" hidden aria-label="即時聊天"><header class="chatHead"><h3 id="chatTitle">即時聊天</h3><button id="chatClose" aria-label="關閉">×</button></header><div class="chatSearchRow" id="chatSearchRow"><input id="chatSearch" type="search" placeholder="搜尋成員"></div><div class="chatView" id="chatView"></div></section><button id="chatLauncher" type="button">☏ 即時聊天</button></div>
<div class="dialogBack" id="dialogBack" hidden><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialogHead"><h2 id="dialogTitle"></h2><button id="closeDialog" aria-label="關閉">×</button></div><div id="dialogBody"></div></div></div><div id="toast" role="status" aria-live="polite"></div>
<script src="/paleo-msg.js?v=30"></script><script src="/app.js?v=43"></script></body></html>
